
services:
  proxy:
    image: nginx:latest
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx.conf:/etc/nginx/nginx.conf        
    ports:
      - 80:80
    depends_on:
      - example-frontend
      - example-backend
  example-backend:
    image: example-backend
    ports:
      - 8080:8080
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=example
      - POSTGRES_PASSWORD=example
      - POSTGRES_DATABASE=postgres
    
  
  example-frontend:
    image: example-frontend
    ports:
      - 5001:5001
      
  redis:
    image: redis:alpine
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=example
      - POSTGRES_PASSWORD=example
    restart: unless-stopped
    volumes:
      #mkdir ./database before running docker compose
      # chmod 700 ./database
      - ./database:/var/lib/postgresql/data
 